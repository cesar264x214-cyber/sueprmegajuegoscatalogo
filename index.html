<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>

    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: rgba(51, 65, 85, 0.8);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.85)), 
                        url('https://i.pinimg.com/736x/20/0c/98/200c983ebeeccf7f131cb61d674eb87d.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .gif-flotante {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 70px;
            height: auto;
            z-index: 1000;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
            border-radius: 12px;
        }

        .perro-flotante {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: auto;
            z-index: 1000;
            border-radius: 12px;
            border: 2px solid var(--border);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem 1rem 1rem;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(5px);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            color: #60a5fa;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        section {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 {
            margin-top: 0;
            color: #f1f5f9;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        input, select {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <img src="https://media.tenor.com/UdZLAkeDX84AAAAj/lbp-littlebigplanet.gif" alt="LittleBigPlanet GIF" class="gif-flotante">

    <img src="https://i.pinimg.com/736x/bb/e0/88/bbe088a20cf61bf08df158ac83cc9b56.jpg" alt="Perrito de Pinterest" class="perro-flotante">

    <header>
        <h1>Sistema de Inventario</h1>
        <p>Administración de productos por categoría</p>
    </header>

    <main>
        <section>
            <h2>Registrar Categorías</h2>
            <form id="formCategorias">
                <div class="form-group">
                    <label for="nombreCategoria">Nombre de la Categoría</label>
                    <input type="text" id="nombreCategoria" name="nombreCategoria" placeholder="Ej. Electrónica, Ropa..." required>
                </div>
                <button type="submit">Registrar Categoría</button>
            </form>
        </section>

        <section>
            <h2>Registrar Productos</h2>
            <form id="formProductos">
                <div class="form-group">
                    <label for="nombreProducto">Nombre del Producto</label>
                    <input type="text" id="nombreProducto" name="nombreProducto" placeholder="Ej. Laptop, Camisa..." required>
                </div>
                
                <div class="form-group">
                    <label for="categoriaProducto">Seleccionar Categoría</label>
                    <select id="categoriaProducto" name="categoriaProducto" required>
                        <option value="" disabled selected>Elige una categoría</option>
                        <option value="1">Electrónica</option>
                        <option value="2">Ropa</option>
                    </select>
                </div>
                <button type="submit">Registrar Producto</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Derechos reservados para Angel</p>
    </footer>

    <script>
        const formCategorias = document.getElementById('formCategorias');
        
        formCategorias.addEventListener('submit', function(e) {
            e.preventDefault(); 
            const nombreCat = document.getElementById('nombreCategoria').value;
            
            alert(`¡Categoría "${nombreCat}" registrada con éxito!`);
            formCategorias.reset();
        });
    </script>
</body>
</html>
